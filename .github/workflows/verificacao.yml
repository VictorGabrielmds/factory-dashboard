name: Verificação

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  painel:
    name: Painel — lint e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:public-exposure
      - run: npm run audit:public-exposure
      - run: npm run build

  backend:
    name: Backend Node 24 — testes e regras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: functions
      - run: npm run lint
        working-directory: functions
      - run: npm run test:ci
        working-directory: functions
